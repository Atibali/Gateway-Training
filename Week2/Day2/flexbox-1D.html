<!DOCTYPE html>
<html>
<head>
    <title>Flexbox 1-D Demo</title>

    <style>
        .nav {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            background: #2563eb;
            padding: 15px;
        }

        .nav a {
            flex: 1 1 auto;
            color: white;
            text-decoration: none;
            background: #4b70ec;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Flexbox Navigation</h2>

    <nav class="nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
