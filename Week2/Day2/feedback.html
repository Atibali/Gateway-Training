<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Feedback</title>
  <link rel="stylesheet" href="feedback.css">
</head>
<body>

  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <h1>Workshop Feedback</h1>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="#form">Form</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container">

    <section id="form" aria-labelledby="form-heading">
      <h2 id="form-heading">Tell us how we did</h2>
      <p class="intro">It takes about a minute. Required fields are marked <span class="req">*</span>.</p>

      <form action="/feedback" method="post">

        <!-- Name -->
        <div class="field">
          <label for="name">Your name <span class="req">*</span></label>
          <input
            type="text"
            id="name"
            name="name"
            required
            minlength="2"
            maxlength="50"
            autocomplete="name"
            placeholder="Jane Doe"
          >
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">Email <span class="req">*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            placeholder="jane@example.com"
          >
        </div>

        <!-- Rating: radio group -->
        <fieldset class="field">
          <legend>How would you rate the workshop? <span class="req">*</span></legend>
          <div class="radio-row">
            <label><input type="radio" name="rating" value="1" required> 1</label>
            <label><input type="radio" name="rating" value="2"> 2</label>
            <label><input type="radio" name="rating" value="3"> 3</label>
            <label><input type="radio" name="rating" value="4"> 4</label>
            <label><input type="radio" name="rating" value="5"> 5</label>
          </div>
        </fieldset>

        <!-- Topic select -->
        <div class="field">
          <label for="topic">Favourite topic</label>
          <select id="topic" name="topic">
            <option value="">-- Choose --</option>
            <optgroup label="Frontend">
              <option value="html">HTML</option>
              <option value="css">CSS</option>
            </optgroup>
            <optgroup label="Testing">
              <option value="agile">Agile Testing</option>
              <option value="devtools">DevTools</option>
            </optgroup>
          </select>
        </div>

        <!-- Comments -->
        <div class="field">
          <label for="comments">Comments</label>
          <textarea id="comments" name="comments" rows="4" maxlength="500"
                    placeholder="What worked well? What could be better?"></textarea>
        </div>

        <!-- Consent -->
        <div class="field checkbox">
          <label>
            <input type="checkbox" name="consent" required>
            I agree that my feedback may be used to improve future workshops. <span class="req">*</span>
          </label>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">Send feedback</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </div>
      </form>
    </section>

    <aside id="about" class="card" aria-labelledby="about-heading">
      <h2 id="about-heading">About this form</h2>
      <img src="logo.svg" alt="Logo" width="48" height="48" class="logo">
      <p>Your responses are anonymous unless you include your name.</p>
      <p class="small">Questions? <a href="mailto:team@example.com">team@example.com</a></p>
    </aside>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Workshop Team</p>
  </footer>

</body>
</html>
